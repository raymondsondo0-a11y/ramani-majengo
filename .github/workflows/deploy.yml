name: Deploy Ramani Majengo to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare server-only OpenAI configuration
        shell: bash
        run: |
          mkdir -p api
          KEY_B64="$(printf '%s' "${{ secrets.OPENAI_API_KEY }}" | base64 -w 0)"
          printf "<?php\n$OPENAI_API_KEY = base64_decode('%s');\n" "$KEY_B64" > api/openai-config.php

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: /aicah.kesug.com/htdocs/
          protocol: ftp
          port: 21
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
